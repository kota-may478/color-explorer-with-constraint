<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Explorer with Constraint</title>
<meta name="description" content="Visually explore color palettes satisfying WCAG contrast and color vision simulation constraints on the S-V map.">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #f2f1ee;
  --surface3: #e8e7e3;
  --border: rgba(0,0,0,0.10);
  --border2: rgba(0,0,0,0.06);
  --text: #1a1917;
  --text2: #6b6860;
  --text3: #a09e99;
  --ok: #1a6630;
  --ok-bg: #d4edda;
  --ok-mid: #1a8a72;
  --warn: #856404;
  --warn-bg: #fff3cd;
  --fail: #8b2222;
  --fail-bg: #fce8e8;
  --accent: #2d6a9f;
  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'DM Mono', monospace;
  --sans: 'Zen Kaku Gothic New', sans-serif;
}

/* ── Dark mode ── */
body.dark {
  --bg: #18181b;
  --surface: #27272a;
  --surface2: #3f3f46;
  --surface3: #52525b;
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.06);
  --text: #f4f4f5;
  --text2: #a1a1aa;
  --text3: #71717a;
  --ok: #4ade80;
  --ok-bg: #14532d;
  --ok-mid: #22c55e;
  --warn: #fbbf24;
  --warn-bg: #713f12;
  --fail: #f87171;
  --fail-bg: #7f1d1d;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background 0.2s, color 0.2s;
}

/* ── Header ── */
header {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 1.5rem;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 10px;
}
.logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .04em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.logo-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--ok-mid);
  flex-shrink: 0;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.header-tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 10px;
}
.icon-btn {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.1s, color 0.1s;
  user-select: none;
  -webkit-user-select: none;
}
.icon-btn:hover { background: var(--surface3); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.lang-btn {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  white-space: nowrap;
}
.lang-btn:hover { background: var(--surface3); color: var(--text); }

/* ── Settings panel ── */
.settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  align-items: flex-start;
  justify-content: flex-end;
}
.settings-overlay.open { display: flex; }
.settings-panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  width: 300px;
  max-width: 92vw;
  height: 100%;
  padding: 1.5rem 1.25rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.settings-panel h2 {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.settings-panel h2 button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--text3);
  line-height: 1;
}
.settings-panel h2 button:hover { color: var(--text); }
.settings-section-title {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.settings-row:last-child { margin-bottom: 0; }
.settings-row label {
  font-size: 12px;
  color: var(--text2);
  flex: 1;
}
.color-picker-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.color-picker-wrap input[type=color] {
  width: 32px; height: 28px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  cursor: pointer;
}
.color-picker-wrap .hex-input {
  font-family: var(--mono);
  font-size: 11px;
  width: 80px;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  color: var(--text);
  outline: none;
}
.color-picker-wrap .hex-input:focus { border-color: var(--ok-mid); }
.reset-colors-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  width: 100%;
}
.reset-colors-btn:hover { background: var(--surface3); color: var(--text); }

/* ── Layout ── */
.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}
.hero {
  margin-bottom: 2.5rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border2);
}
.hero h1 {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: .5rem;
  line-height: 1.3;
}
.hero p {
  font-size: 14px;
  color: var(--text2);
  max-width: 600px;
  line-height: 1.7;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  margin-bottom: 14px;
}
.card-sm {
  padding: .85rem 1rem;
  margin-top: 8px;
}
.sec-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.card-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.card-title { font-size: 13px; font-weight: 500; color: var(--text); }

/* ── Step label ── */
.step-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0 8px;
}
.step-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--ok-mid);
  color: #fff;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  letter-spacing: .04em;
}

/* ── Sliders & Controls ── */
.slider-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 9px;
}
.slider-row:last-child { margin-bottom: 0; }
.slider-row label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text2);
  width: 16px;
  flex-shrink: 0;
}
input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--surface3);
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  transition: transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
  border: 2px solid var(--surface);
}
.sval {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}
.sb {
  width: 26px; height: 26px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transition: background .1s;
}
.sb:hover { background: var(--surface3); }
.sb:active { transform: scale(.92); }
.rb {
  width: 26px; height: 26px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text3);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .1s, color .1s;
}
.rb:hover { background: var(--surface3); color: var(--text); }
.rb:active { transform: scale(.92); }
.link-btn {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  flex-shrink: 0;
}
.link-btn:hover { color: var(--text2); }

/* ── Calc button ── */
.calc-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 18px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--text);
  color: var(--surface);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s;
}
.calc-btn:hover { opacity: .85; }
.calc-btn.running { background: var(--surface3); color: var(--text3); cursor: default; }
.calc-status {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text3);
}

/* ── Badges ── */
.badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 20px;
}
.badge.pass { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.fail { background: var(--fail-bg); color: var(--fail); }
.ok-badge { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); }
.ng-badge { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 10px; background: var(--fail-bg); color: var(--fail); }
.pending-badge { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 10px; background: var(--surface2); color: var(--text3); }

/* ── Two-col layout ── */
.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
@media (max-width: 600px) {
  .row2 { grid-template-columns: 1fr; }
}

/* ── Checkbox grid ── */
.cbox-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}
@media (max-width: 480px) { .cbox-grid { grid-template-columns: 1fr; } }
.cbox-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 5px 0;
  cursor: pointer;
  border-bottom: 1px solid var(--border2);
}
.cbox-row:last-child { border-bottom: none; }
.cbox-row input[type=checkbox] {
  margin-top: 3px;
  flex-shrink: 0;
  width: 14px; height: 14px;
  accent-color: var(--ok-mid);
  cursor: pointer;
}
.clbl { font-size: 12px; color: var(--text); line-height: 1.4; }
.clbl span { font-size: 10px; color: var(--text3); display: block; font-family: var(--mono); }

/* ── Threshold ── */
.thr-section {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border2);
}
.thr-title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.thr-desc { font-size: 11px; color: var(--text3); margin-bottom: 9px; font-family: var(--mono); }
.thr-row { display: flex; align-items: center; gap: 7px; }
.thr-hints { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thr-hint {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 9px;
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid transparent;
  cursor: default;
  transition: all .15s;
}
.thr-hint.active { background: var(--ok-bg); color: var(--ok); border-color: rgba(26,134,114,.3); }

/* ── Hue bar ── */
.hue-bar-wrap { padding: 0 8px; }
.hue-bar { width: 100%; height: 14px; border-radius: 7px; display: block; }
.hue-slider-stack {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.hue-slider-stack input[type=range] { width: 100%; }

/* ── Map ── */
.map-outer {
  position: relative;
  padding-left: 24px;
  margin-bottom: 5px;
}
.axis-v {
  position: absolute;
  left: 0; top: 14px; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text3);
}
.axis-s {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text3);
  padding: 0 1px;
  margin-bottom: 2px;
}
canvas.map {
  display: block;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  cursor: crosshair;
  width: 100%;
  height: auto;
  touch-action: none;
}
.map-wrap {
  position: relative;
  display: block;
  line-height: 0;
}
.map-cursor-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}
.cursor-outer {
  fill: rgba(255,255,255,0.92);
  stroke: #1a1917;
  stroke-width: 1.5;
}
.cursor-inner {
  fill: #1a1917;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  margin-bottom: 4px;
}
.leg { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.map-note { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-bottom: 5px; }
.stale-note { font-family: var(--mono); font-size: 10px; color: var(--warn); margin-top: 4px; min-height: 15px; }

/* ── Map hint box ── */
.map-hint-box {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-top: 6px;
  line-height: 1.7;
  white-space: pre-line;
}
.map-hint-box.hidden { display: none; }

/* ── Swatch ── */
.swatch {
  width: 100%;
  height: 48px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-bottom: 5px;
  transition: background .08s;
}
.hexlbl {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  text-align: center;
}

/* ── Judge card ── */
.judge-overall {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.judge-badge {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  padding: 5px 18px;
  border-radius: 20px;
}
.judge-text { font-size: 13px; color: var(--text2); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
.dc { border-radius: var(--radius-sm); padding: 8px 10px; border: 1px solid var(--border); }
.dc-num { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text); }
.dc-lbl { font-size: 10px; color: var(--text2); margin-top: 3px; }
.sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
@media (max-width: 480px) { .sim-grid { grid-template-columns: 1fr; } }
.sim-chip { border-radius: var(--radius-sm); padding: 8px 10px; border: 1px solid var(--border); }
.sim-lbl { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-bottom: 5px; }
.sim-dots { display: flex; gap: 6px; align-items: center; }
.sim-dot { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--border2); }
.sub-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
  margin: 14px 0 6px;
}
.note { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-top: 8px; }

/* ── Divider ── */
.divider { height: 1px; background: var(--border2); margin: 20px 0; }

/* ── Footer ── */
footer {
  text-align: center;
  padding: 2rem;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  border-top: 1px solid var(--border2);
}
footer a { color: var(--text3); }
</style>
</head>
<body>

<!-- ── Settings panel ── -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel" id="settingsPanel">
    <h2 id="settingsTitle">Settings <button id="closeSettings">&#x2715;</button></h2>

    <div>
      <div class="settings-section-title" id="settingsThemeLabel">Theme</div>
      <div class="settings-row">
        <label id="settingsDarkModeLabel">Dark mode</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="darkToggle" style="width:16px;height:16px;accent-color:var(--ok-mid);cursor:pointer;">
        </label>
      </div>
    </div>

    <div>
      <div class="settings-section-title" id="settingsBgLabel">Background colors</div>
      <div class="settings-row">
        <label id="settingsLightBgLabel">Light mode bg</label>
        <div class="color-picker-wrap">
          <input type="color" id="lightBgPicker" value="#f7f6f3">
          <input type="text" class="hex-input" id="lightBgHex" value="#f7f6f3" maxlength="7">
        </div>
      </div>
      <div class="settings-row">
        <label id="settingsDarkBgLabel">Dark mode bg</label>
        <div class="color-picker-wrap">
          <input type="color" id="darkBgPicker" value="#18181b">
          <input type="text" class="hex-input" id="darkBgHex" value="#18181b" maxlength="7">
        </div>
      </div>
      <button class="reset-colors-btn" id="resetColorsBtn" style="margin-top:4px;">Reset to defaults</button>
    </div>

    <div>
      <div class="settings-section-title" id="settingsLangLabel">Language</div>
      <div class="settings-row">
        <label>English</label>
        <button class="lang-btn" id="settingsLangEn">EN</button>
      </div>
      <div class="settings-row">
        <label>日本語</label>
        <button class="lang-btn" id="settingsLangJa">JA</button>
      </div>
    </div>
  </div>
</div>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    Color Explorer with Constraint
  </div>
  <div class="header-right">

// Color math
// ══════════════════════════════════════════════
function hsv2rgb(h, s, v) {
  s /= 100; v /= 100;
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255)];
}
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join(''); }
function hex2rgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
function lum(r, g, b) {
  return [r, g, b].reduce((a, c, i) => {
    const s = c / 255;
    return a + (s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4)) * [0.2126, 0.7152, 0.0722][i];
  }, 0);
}
function cratio(h1, h2) {
  const [r1, g1, b1] = hex2rgb(h1), [r2, g2, b2] = hex2rgb(h2);
  const l1 = lum(r1, g1, b1), l2 = lum(r2, g2, b2);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
function simCB(r, g, b, t) {
  if (t === 0) return [Math.round(0.567*r+0.433*g), Math.round(0.558*r+0.442*g), Math.round(0.242*r+0.758*b)];
  if (t === 1) return [Math.round(0.625*r+0.375*g), Math.round(0.7*r+0.3*g),     Math.round(0.3*g+0.7*b)];
  if (t === 2) return [Math.round(0.95*r+0.05*b),   Math.round(0.433*g+0.567*b), Math.round(0.475*g+0.525*b)];
  const l = Math.round(0.299*r + 0.587*g + 0.114*b); return [l, l, l];
}

// ── Getters ──
function gv(id) { return +document.getElementById(id).value; }
function getThr() { return Math.round(gv('slThr') * 10) / 10; }
function getChecked() { return I18N[lang].clist.map(c => document.getElementById(c.id).checked); }

// ── Evaluate one point ──
function evalPoint(mH, mS, mV, aH, aS, aV, checked, thr) {
  const [mr, mg, mb] = hsv2rgb(mH, mS, mV);
  const [ar, ag, ab] = hsv2rgb(aH, aS, aV);
  const mHex = rgb2hex(mr, mg, mb), aHex = rgb2hex(ar, ag, ab);
  const simData = [0, 1, 2, 3].map(t => {
    const sm = simCB(mr, mg, mb, t), sa = simCB(ar, ag, ab, t);
    return { smH: rgb2hex(...sm), saH: rgb2hex(...sa), ratio: cratio(rgb2hex(...sm), rgb2hex(...sa)) };
  });
  const scores = [
    cratio(mHex, W) >= 4.5, cratio(mHex, BG) >= 4.5,
    cratio(aHex, W) >= 4.5, cratio(mHex, aHex) >= 3.0,
    ...simData.map(d => d.ratio >= thr),
  ];
  let pass = 0, total = 0;
  checked.forEach((on, i) => { if (on) { total++; if (scores[i]) pass++; } });
  return {
    pass, total, scores, mHex, aHex, simData,
    crMW: cratio(mHex, W), crMBG: cratio(mHex, BG),
    crAW: cratio(aHex, W), crMA: cratio(mHex, aHex),
  };
}

// ── Accent grid ──
function buildAccentGrid(mH, mS, mV, aH, checked, thr) {
  const grid = new Uint8Array(RES_A * RES_A);
  let okCount = 0;
  for (let si = 0; si < RES_A; si++) {
    for (let vi = 0; vi < RES_A; vi++) {
      const s = Math.round(si / (RES_A - 1) * 100);
      const v = Math.round((1 - vi / (RES_A - 1)) * 100);
      const { pass, total } = evalPoint(mH, mS, mV, aH, s, v, checked, thr);
      const ok = total > 0 && pass === total;
      grid[vi * RES_A + si] = ok ? 1 : 0;
      if (ok) okCount++;
    }
  }
  return { grid, okCount };
}

// ── Accent existence check ──
function accentHasAny(mH, mS, mV, aH, checked, thr) {
  for (let si = 0; si < RES_A; si++) {
    for (let vi = 0; vi < RES_A; vi++) {
      const s = Math.round(si / (RES_A - 1) * 100);
      const v = Math.round((1 - vi / (RES_A - 1)) * 100);
      const { pass, total } = evalPoint(mH, mS, mV, aH, s, v, checked, thr);
      if (total > 0 && pass === total) return true;
    }
  }
  return false;
}

// ── Main grid async ──
let gridMData = null, calcRunning = false;

function buildMainGridAsync(H, aH, checked, thr, onDone) {
  if (calcRunning) return;
  calcRunning = true;
  const grid = new Uint8Array(RES_M * RES_M);
  let okCount = 0, i = 0;
  const total = RES_M * RES_M;
  const btn = document.getElementById('calcBtn');
  const status = document.getElementById('calcStatus');
  btn.classList.add('running');
  btn.textContent = I18N[lang].calcRunning;
  status.textContent = '0%';
  function step() {
    const end = Math.min(i + 5, total);
    while (i < end) {
      const si = i % RES_M, vi = Math.floor(i / RES_M);
      const mS = Math.round(si / (RES_M - 1) * 100);
      const mV = Math.round((1 - vi / (RES_M - 1)) * 100);
      const ok = accentHasAny(H, mS, mV, aH, checked, thr);
      grid[vi * RES_M + si] = ok ? 1 : 0;
      if (ok) okCount++;
      i++;
    }
    status.textContent = Math.round(i / total * 100) + '%';
    if (i < total) {
      requestAnimationFrame(step);
    } else {
      calcRunning = false;
      btn.classList.remove('running');
      btn.textContent = I18N[lang].recalcBtn;
      status.textContent = I18N[lang].calcDone;
      gridMData = { grid, okCount };
      document.getElementById('mainStale').textContent = '';
      document.getElementById('mapMHintBox').classList.add('hidden');
      onDone();
    }
  }
  requestAnimationFrame(step);
}

// ── Draw map ──
function drawMap(canvasId, grid, res, curS, curV) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  const img = ctx.createImageData(CW, CH);
  for (let py = 0; py < CH; py++) {
    for (let px = 0; px < CW; px++) {
      const si = Math.round(px / (CW - 1) * (res - 1));
      const vi = Math.round(py / (CH - 1) * (res - 1));
      const ok = grid[vi * res + si] === 1;
      const idx = (py * CW + px) * 4;
      img.data[idx]   = ok ? 26  : 221;
      img.data[idx+1] = ok ? 138 : 221;
      img.data[idx+2] = ok ? 114 : 221;
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function drawEmptyMap(canvasId, curS, curV) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  ctx.fillStyle = '#eceae6'; ctx.fillRect(0, 0, CW, CH);
}

function updateCursor(mapId, s, v) {
  const suffix = mapId === 'mapM' ? 'M' : 'A';
  const cx = s / 100 * 239;
  const cy = (1 - v / 100) * 239;
  const outer = document.getElementById('cursor' + suffix + 'Outer');
  const inner = document.getElementById('cursor' + suffix + 'Inner');
  if (outer) { outer.setAttribute('cx', cx); outer.setAttribute('cy', cy); }
  if (inner) { inner.setAttribute('cx', cx); inner.setAttribute('cy', cy); }
}

function drawHueBar(canvasId, selectedH) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  for (let x = 0; x < CW; x++) {
    const h = x / CW * 360;
    const [r, g, b] = hsv2rgb(h, 100, 100);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, 0, 1, CH);
  }
  const cx = Math.round(selectedH / 360 * CW);
  ctx.strokeStyle = 'white'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, CH); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, CH); ctx.stroke();
}

function updateThrUI() {
  const t = getThr();
  document.getElementById('vThr').textContent = t.toFixed(1);
  const map = { 10:'hint10', 30:'hint30', 45:'hint45', 70:'hint70' };
  const key = Math.round(t * 10);
  Object.values(map).forEach(id => document.getElementById(id).classList.remove('active'));
  if (map[key]) document.getElementById(map[key]).classList.add('active');
}

function updateAccentMap() {
  const H = gv('slH'), AH = gv('slAH'), MS = gv('slMS'), MV = gv('slMV'), thr = getThr();
  const checked = getChecked();
  const ra = buildAccentGrid(H, MS, MV, AH, checked, thr);
  const pct = Math.round(ra.okCount / RES_A / RES_A * 100);
  document.getElementById('accentOkBadge').innerHTML = ra.okCount > 0
    ? `<span class="ok-badge">OK ${pct}%</span>`
    : `<span class="ng-badge">${I18N[lang].okRegionNone}</span>`;
  drawMap('mapA', ra.grid, RES_A, gv('slAS'), gv('slAV'));
  updateCursor('mapA', gv('slAS'), gv('slAV'));
}

function updateJudge() {
  const t = I18N[lang];
  const H = gv('slH'), AH = gv('slAH'), MS = gv('slMS'), MV = gv('slMV');
  const AS = gv('slAS'), AV = gv('slAV'), thr = getThr();
  const checked = getChecked();
  const totalChecked = checked.filter(Boolean).length;
  const res = evalPoint(H, MS, MV, AH, AS, AV, checked, thr);
  document.getElementById('swM').style.background = res.mHex;
  document.getElementById('hexM').textContent = res.mHex.toUpperCase();
  document.getElementById('swA').style.background = res.aHex;
  document.getElementById('hexA').textContent = res.aHex.toUpperCase();

  const allOk = totalChecked > 0 && res.pass === res.total;
  const cls = allOk ? 'pass' : (res.pass > 0 && res.pass >= res.total * 0.75) ? 'warn' : 'fail';
  function bw(v, thr2) { return v >= thr2 ? 'pass' : v >= thr2 * 0.75 ? 'warn' : 'fail'; }
  const f2 = n => n.toFixed(2);

  const simHtml = res.simData.map((d, i) => {
    const ok = d.ratio >= thr;
    return `<div class="sim-chip">
      <div class="sim-lbl">${t.simNames[i]}${checked[4+i] ? '' : '&nbsp;*'}</div>
      <div class="sim-dots">
        <div class="sim-dot" style="background:${d.smH}"></div>
        <div class="sim-dot" style="background:${d.saH}"></div>
        <span class="badge ${ok ? 'pass' : 'fail'}" style="margin-left:4px;">${f2(d.ratio)}</span>
      </div>
    </div>`;
  }).join('');

  const crVals = [res.crMW, res.crMBG, res.crAW, res.crMA];
  const crThrs = [4.5, 4.5, 4.5, 3.0];
  const dcHtml = crVals.map((v, i) =>
    `<div class="dc"><div class="dc-num">${f2(v)} <span class="badge ${bw(v, crThrs[i])}">${v >= crThrs[i] ? 'OK' : 'NG'}</span></div>
    <div class="dc-lbl">${t.dcLabels[i]}${checked[i] ? '' : ' *'}</div></div>`
  ).join('');

  document.getElementById('judgeCard').innerHTML = `
    <div class="judge-overall">
      <span class="badge judge-badge ${cls}" style="font-size:13px;padding:5px 18px;">
        ${allOk ? t.judgeGood : totalChecked === 0 ? t.noCondition : res.pass + ' / ' + res.total}
      </span>
      <span class="judge-text">${allOk ? t.allOk : totalChecked === 0 ? '' : (res.total - res.pass) + t.notAchieved}</span>
    </div>
    <div class="sub-label">${t.subContrast}</div>
    <div class="detail-grid">${dcHtml}</div>
    <div class="sub-label" style="margin-top:14px;">${t.subSim} <span style="font-size:10px;font-weight:400;">(${t.threshold}: ${thr.toFixed(1)})</span></div>
    <div class="sim-grid">${simHtml}</div>
    <div class="note">${t.excludedNote}</div>
  `;
}

  gridMData = null;
  document.getElementById('mainStale').textContent = I18N[lang].staleMsg;
  document.getElementById('mainOkBadge').innerHTML = `<span class="pending-badge">${I18N[lang].needRecalc}</span>`;

function update() {
  document.getElementById('vH').textContent  = gv('slH');
  document.getElementById('vAH').textContent = gv('slAH');
  document.getElementById('vMS').textContent = gv('slMS');
  document.getElementById('vMV').textContent = gv('slMV');
  document.getElementById('vAS').textContent = gv('slAS');

  updateThrUI();
  drawHueBar('hueBarM', gv('slH'));
  drawHueBar('hueBarA', gv('slAH'));

  if (gridMData) drawMap('mapM', gridMData.grid, RES_M, gv('slMS'), gv('slMV'));
  else drawEmptyMap('mapM', gv('slMS'), gv('slMV'));
  updateCursor('mapM', gv('slMS'), gv('slMV'));
}

// ── Calc button ──
document.getElementById('calcBtn').addEventListener('click', () => {
  if (calcRunning) return;
  gridMData = null;
  buildMainGridAsync(gv('slH'), gv('slAH'), getChecked(), getThr(), () => {
    const pct = Math.round(gridMData.okCount / RES_M / RES_M * 100);
    document.getElementById('mainOkBadge').innerHTML = gridMData.okCount > 0
      ? `<span class="ok-badge">OK ${pct}%</span>`
      : `<span class="ng-badge">${I18N[lang].okRegionNone}</span>`;
    drawMap('mapM', gridMData.grid, RES_M, gv('slMS'), gv('slMV'));

  });
});

// ── Hold buttons ──
function setupHold(btnId, sliderId, dir, cb, stepSize) {
  const btn = document.getElementById(btnId), sl = document.getElementById(sliderId);
  const s = stepSize || 1;
  let raf = null, to = null;
  function tick() {
    sl.value = Math.max(+sl.min, Math.min(+sl.max, Math.round((+sl.value + s * dir) * 10) / 10));
    cb(); raf = requestAnimationFrame(tick);
  }
  function start(e) {
    e.preventDefault();
    sl.value = Math.max(+sl.min, Math.min(+sl.max, Math.round((+sl.value + s * dir) * 10) / 10));
    cb(); to = setTimeout(() => { raf = requestAnimationFrame(tick); }, 400);
  }
  function stop() { clearTimeout(to); if (raf) { cancelAnimationFrame(raf); raf = null; } }
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, { passive: false });
  document.addEventListener('mouseup', stop);
  document.addEventListener('touchend', stop);
}

// ── Map drag ──
function setupMapDrag(canvasId, sId, vId, cb) {
  const canvas = document.getElementById(canvasId);
  let dragging = false;
  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      s: Math.round(Math.max(0, Math.min(1, (cx - rect.left) / rect.width)) * 100),
      v: Math.round(Math.max(0, Math.min(1, 1 - (cy - rect.top) / rect.height)) * 100),
    };
  }
  function apply(e) { e.preventDefault(); const { s, v } = pos(e); document.getElementById(sId).value = s; document.getElementById(vId).value = v; cb(); }
  canvas.addEventListener('mousedown',  e => { dragging = true; apply(e); });
  canvas.addEventListener('mousemove',  e => { if (dragging) apply(e); });
  canvas.addEventListener('touchstart', e => { dragging = true; apply(e); }, { passive: false });
  canvas.addEventListener('touchmove',  e => { if (dragging) apply(e); }, { passive: false });
  canvas.addEventListener('touchend',   () => { dragging = false; });
  document.addEventListener('mouseup',  () => { dragging = false; });
}
